name: viorka-agent-service-tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  service-systemd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Real systemd service lifecycle (disposable runner)
        run: sudo env VIORKA_DISPOSABLE_SERVICE_TEST=yes sh scripts/test_services_linux.sh
  service-openrc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Real OpenRC service lifecycle (disposable Alpine container)
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src alpine:3.22 sh -ec '
            # The minimal Alpine image needs BusyBox service scripts for syslog.
            apk add --no-cache openrc busybox-openrc
            mkdir -p /run/openrc
            touch /run/openrc/softlevel
            sed -i "s/^#rc_sys=.*/rc_sys=\"docker\"/" /etc/rc.conf
            rc-service syslog start
            VIORKA_DISPOSABLE_SERVICE_TEST=yes sh scripts/test_services_linux.sh
          '

  engine-openrc:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v3
      - name: Build engine service tests
        run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go test -c -o /tmp/runtime.test ./internal/runtime
      - name: Real OpenRC engine lifecycle (Alpine 3.21)
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} -v /tmp/runtime.test:/runtime.test:ro alpine:3.21 sh -ec '
            apk add --no-cache openrc
            mkdir -p /run/openrc
            touch /run/openrc/softlevel
            sed -i "s/^#rc_sys=.*/rc_sys=\"docker\"/" /etc/rc.conf
            VIORKA_DISPOSABLE_SERVICE_TEST=yes /runtime.test -test.run "^TestOpenRCNativeLifecycle$" -test.v
          '
