name: viorka-agent-release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  services:
    uses: ./.github/workflows/service-tests.yml
  release:
    needs: services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Installer checks
        run: |
          sh -n install.sh
          python3 scripts/test_install.py
          python3 scripts/test_services.py
          python3 scripts/test_release.py
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(go run ./cmd/viorka-agent version | awk '{print $2}')
          test "$RELEASE_TAG" = "v$version"
      - name: Test
        run: go test ./...
      - name: Build release assets
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            asset="viorka-agent-linux-$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "dist/$asset" ./cmd/viorka-agent
            sha256sum "dist/$asset" | cut -d ' ' -f 1 > "dist/$asset.sha256"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
