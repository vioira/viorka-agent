name: viorka-agent-ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: Installer checks
        run: |
          sh -n install.sh
          python3 scripts/test_install.py
          python3 scripts/test_services.py
          python3 scripts/test_release.py
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Generated protocol check
        run: python3 scripts/generate_protocol.py --schema protocol/v1/envelope.schema.json --check
      - name: Build amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/viorka-agent-amd64 ./cmd/viorka-agent
      - name: Build arm64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/viorka-agent-arm64 ./cmd/viorka-agent
  services:
    uses: ./.github/workflows/service-tests.yml
